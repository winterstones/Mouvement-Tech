name: Mouvement-Tech CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Validate 4 Reference Profiles (Perceval, Bohort, Leodagan, Arthur)
      run: |
        python scripts/evaluate.py perceval
        python scripts/evaluate.py bohort
        python scripts/evaluate.py leodagan
        python scripts/evaluate.py arthur

    - name: Audit AIDD Harness
      run: |
        python scripts/audit_harness.py